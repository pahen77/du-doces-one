  <title>Du Doces Distribuidora - E‑Commerce</title>
  <meta name="description" content="Du Doces Distribuidora — bebidas, chocolates, salgadinhos e utilidades com entrega rápida.">
  <meta name="theme-color" content="#C62828">
  <meta property="og:site_name" content="Du Doces Distribuidora">
  <meta property="og:title" content="Du Doces Distribuidora - E‑Commerce">
  <meta property="og:description" content="As melhores marcas de bebidas, chocolates, salgadinhos e utilidades.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <link rel="stylesheet" href="./style.css"/>

<body class="dark">
  <!-- Top bar -->
  <header class="topbar">
    <button id="btnMenu" aria-label="Menu">☰</button>
    <h1 class="logo">Du Doces <span>Distribuidora</span></h1>
    <div class="top-actions">
      <input id="search" type="search" placeholder="Buscar produtos...">
      <button id="btnCart" aria-label="Carrinho">🛒 <span id="cartBadge">0</span></button>
    </div>
  </header>

  <!-- Side menu -->
  <aside id="sideMenu" class="drawer">
    <button class="close" data-close>×</button>
    <nav>
      <a href="#/" data-close>Início</a>
      <a href="#/login" data-close>Login / Cadastro</a>
      <a href="#/conta" data-close>Minha Conta</a>
      <a href="#/sobre" data-close>Sobre Nós</a>
      <a href="#/contato" data-close>Contato</a>
      <a href="#/politica" data-close>Política de Privacidade</a>
      <a href="#/termos" data-close>Termos de Uso</a>
      <hr>
      <button id="toggleTheme">Alternar tema</button>
    </nav>
  </aside>

  <!-- Main SPA container -->
  <main id="app"></main>

  <!-- Carrinho drawer -->
  <aside id="cartDrawer" class="drawer right">
    <button class="close" data-close>×</button>
    <h3>Carrinho</h3>
    <div id="cartList"></div>
    <div class="cart-footer">
      <div>Total: <strong id="cartTotal">R$ 0,00</strong></div>
      <a class="btn primary" href="#/checkout">Finalizar</a>
    </div>
  </aside>

  <!-- Floating AI button -->
  <button id="fabAI" class="fab" title="Posso ajudar?">🤖</button>
